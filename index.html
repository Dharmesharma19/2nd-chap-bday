<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meet at Desu</title>
<meta name="theme-color" content="#ffd9e4">
<style>
:root{--bg:#fff6ef;--bg2:#ffd9e4;--rose:#d94a74;--peach:#b83a64;--lilac:#7b5aa6;--ink:#5a1730;
--serif:'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif;color-scheme:light}
*{box-sizing:border-box}
html{overflow-x:hidden}
body{margin:0;min-height:100vh;min-height:100svh;background:radial-gradient(ellipse at 50% 0%,var(--bg2),var(--bg) 72%) var(--bg);color:var(--ink);font-family:var(--serif);text-align:center;overflow-x:hidden;
display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:32px 20px calc(48px + env(safe-area-inset-bottom,0px));animation:in 1.2s ease both}
@keyframes in{from{opacity:0}to{opacity:1}}
.deco{font-size:2.6rem}
h1{font-size:clamp(2.2rem,8vw,4rem);line-height:1.1;margin:0}
h2{font-style:italic;font-size:clamp(1.5rem,5.5vw,2.2rem);color:var(--peach);margin:0}
p{margin:0;max-width:32ch;line-height:1.55;font-size:clamp(1.1rem,4vw,1.4rem)}
.hand{font-style:italic;font-size:1.25rem;color:var(--lilac)}
.timer{display:flex;gap:12px;justify-content:center;flex-wrap:nowrap}
.box{min-width:84px;padding:16px 8px 12px;border-radius:20px;border:2px solid var(--rose);background:rgba(255,255,255,.6);box-shadow:0 6px 16px #5a173018}
.box b{display:block;font-size:clamp(2.4rem,11vw,3.6rem);line-height:1;color:var(--rose);font-variant-numeric:tabular-nums}
.box small{display:block;margin-top:6px;font-size:.85rem;color:var(--lilac);letter-spacing:.08em;text-transform:uppercase}
.ticket{border:2px dashed var(--peach);border-radius:20px;padding:20px 24px;max-width:360px;background:rgba(255,255,255,.6)}
.ticket p{max-width:none}
.ticket strong{display:block;font-size:clamp(1.8rem,7vw,2.6rem);color:var(--peach);margin-top:4px}
body.done .timer,body.done #before{display:none}
#after{display:none}
body.done #after{display:block}
.pulse{animation:beat .8s infinite alternate}
@keyframes beat{to{transform:scale(1.15)}}
@media (prefers-reduced-motion:reduce){body{animation:none}.pulse{animation:none}}
@media (max-width:380px){.timer{gap:8px}.box{min-width:72px}}
</style>
</head>
<body>

<div class="deco" id="deco">⏳</div>
<h1>The next chapter…</h1>

<div id="before">
  <div class="hand">Counting down…</div>
</div>
<div id="after"><h2>It’s time, Delulu! 🎉</h2></div>

<div class="timer" id="timer" role="timer" aria-live="off">
  <div class="box"><b id="h">--</b><small>Hours</small></div>
  <div class="box"><b id="m">--</b><small>Minutes</small></div>
  <div class="box"><b id="s">--</b><small>Seconds</small></div>
</div>

<div class="ticket">
  <p>Be ready, and don’t be late.</p>
  <strong>Meet at Desu ♥</strong>
</div>

<script>
/* EDIT THIS: target date and time (India time, UTC+05:30) */
const TARGET=new Date('2026-11-13T11:00:00+05:30').getTime();

const $=id=>document.getElementById(id),pad=n=>String(n).padStart(2,'0');
let timer=null;
function tick(){
  const left=TARGET-Date.now();
  if(left<=0){
    $('h').textContent=$('m').textContent=$('s').textContent='00';
    document.body.classList.add('done');
    $('deco').textContent='🎀';$('deco').classList.add('pulse');
    clearInterval(timer);
    return;
  }
  const t=Math.floor(left/1000);
  $('h').textContent=pad(Math.floor(t/3600));
  $('m').textContent=pad(Math.floor(t%3600/60));
  $('s').textContent=pad(t%60);
}
tick();
if(Date.now()<TARGET)timer=setInterval(tick,250);
</script>
</body>
</html>
